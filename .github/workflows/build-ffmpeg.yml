# .github/workflows/build-ffmpeg.yml
name: Build minimal FFmpeg

on: workflow_dispatch

jobs:
  build-macos-universal:
    runs-on: macos-14
    steps:
      - name: Install dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          # brew arm64 (natif)
          brew install nasm pkg-config lame
          
          # Installe brew x64 via Rosetta si absent
          if [ ! -f /usr/local/bin/brew ]; then
            arch -x86_64 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" </dev/null
          fi

          # lame x64 via brew Rosetta
          arch -x86_64 /usr/local/bin/brew install lame nasm pkg-config

      - name: Download FFmpeg source
        run: |
          curl -L https://ffmpeg.org/releases/ffmpeg-6.1.tar.gz | tar xz
          mv ffmpeg-6.1 ffmpeg-src

      - name: Build arm64
        run: |
          cd ffmpeg-src
          export PKG_CONFIG_PATH="/opt/homebrew/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/opt/homebrew/lib"
          export CPPFLAGS="-I/opt/homebrew/include"
          ./configure \
            --prefix=/tmp/ffmpeg-arm64 \
            --arch=arm64 \
            --disable-everything \
            --disable-network \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --enable-protocol=file \
            --enable-demuxer=mov,mp4,matroska,avi,flv,ogg,wav,aac,mp3 \
            --enable-decoder=aac,aac_latm,mp3,mp3float,opus,vorbis,flac,pcm_s16le,pcm_s16be,pcm_f32le,pcm_s24le \
            --enable-encoder=pcm_s16le,flac \
            --enable-muxer=wav,flac \
            --enable-filter=aresample \
            --enable-libmp3lame \
            --enable-encoder=libmp3lame \
            --enable-muxer=mp3
          make -j$(sysctl -n hw.logicalcpu)
          make install
          strip /tmp/ffmpeg-arm64/bin/ffmpeg

      - name: Clean build
        run: |
          cd ffmpeg-src
          make clean

      - name: Build x64
        run: |
          cd ffmpeg-src
          # Rosetta installe brew dans /usr/local sur Apple Silicon
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:$PKG_CONFIG_PATH"
          export LDFLAGS="-L/usr/local/lib -arch x86_64"
          export CPPFLAGS="-I/usr/local/include -arch x86_64"
          export CC="clang -arch x86_64"
          export CXX="clang++ -arch x86_64"
          ./configure \
            --prefix=/tmp/ffmpeg-x64 \
            --arch=x86_64 \
            --cc="clang -arch x86_64" \
            --extra-cflags="-arch x86_64 -I/usr/local/include" \
            --extra-ldflags="-arch x86_64 -L/usr/local/lib" \
            --disable-everything \
            --disable-network \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --enable-protocol=file \
            --enable-demuxer=mov,mp4,matroska,avi,flv,ogg,wav,aac,mp3 \
            --enable-decoder=aac,aac_latm,mp3,mp3float,opus,vorbis,flac,pcm_s16le,pcm_s16be,pcm_f32le,pcm_s24le \
            --enable-encoder=pcm_s16le,flac \
            --enable-muxer=wav,flac \
            --enable-filter=aresample \
            --enable-libmp3lame \
            --enable-encoder=libmp3lame \
            --enable-muxer=mp3
          make -j$(sysctl -n hw.logicalcpu)
          make install
          strip /tmp/ffmpeg-x64/bin/ffmpeg

      - name: Create Universal binary with lipo
        run: |
          lipo -create \
            /tmp/ffmpeg-arm64/bin/ffmpeg \
            /tmp/ffmpeg-x64/bin/ffmpeg \
            -output /tmp/ffmpeg-universal
          lipo -info /tmp/ffmpeg-universal

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-macos-universal
          path: /tmp/ffmpeg-universal

  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-lame
            make
            pkg-config

      - name: Download FFmpeg source
        shell: msys2 {0}
        run: |
          curl -L https://ffmpeg.org/releases/ffmpeg-6.1.tar.gz | tar xz
          mv ffmpeg-6.1 ffmpeg-src

      - name: Configure and build
        shell: msys2 {0}
        run: |
          cd ffmpeg-src
          ./configure \
            --prefix=C:/ffmpeg-out \
            --target-os=mingw32 \
            --arch=x86_64 \
            --disable-everything \
            --disable-network \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --enable-protocol=file \
            --enable-demuxer=mov,mp4,matroska,avi,flv,ogg,wav,aac,mp3 \
            --enable-decoder=aac,aac_latm,mp3,mp3float,opus,vorbis,flac,pcm_s16le,pcm_s16be,pcm_f32le,pcm_s24le \
            --enable-encoder=pcm_s16le,flac \
            --enable-muxer=wav,flac \
            --enable-filter=aresample \
            --enable-libmp3lame \
            --enable-encoder=libmp3lame \
            --enable-muxer=mp3
          make -j$(nproc)
          make install

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ffmpeg-windows-x64
          path: C:/ffmpeg-out/bin/ffmpeg.exe
